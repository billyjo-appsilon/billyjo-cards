name: Daily Card Sync

# 빌리조 카탈로그 변경 감지 → 신규 제품 카드 자동 생성·커밋
#
# 3시간마다 도는 이유(2026-07-29): 사이트가 짧은 시간에 몰린 prod_view 요청을 막는다.
# 실측 — 한 회차에 300건을 시도하면 138건만 성공하고 162건이 page.goto 타임아웃으로 밀렸다
# (약 140건이 한 창(window)의 한계). 한 번에 많이 긁는 대신 자주 조금씩 가져와
# 밀린 물량(3,000건대)을 며칠에 걸쳐 소화한다. 신규 등록분은 최대 3시간이면 카드가 생긴다.
# 트리거는 admin2 오토 스케쥴러(/collections 의 card_sync 잡)가 단독으로 쥔다 —
# 켜고 끄기·수동 실행·최근 결과를 한 화면에서 보기 위해서다(2026-07-29).
# 여기 자체 cron 을 같이 두면 이중 실행이라 제거. 스케줄 변경은 /collections 에서.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Run daily sync
        run: node scripts/daily-sync.js
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # cards/ 만 커밋하던 탓에 cards-index.json 이 2026-05-31 에 멈춰 있었다.
      # 이 인덱스는 추천 후보 풀이자 admin2 catalog_products 의 원본이라, 멈춘 동안
      # 신규 제품은 상세페이지 카드는 떠도 추천에는 한 건도 못 올라갔다(카드 보유 1,145건 누락).
      - name: Rebuild cards-index.json
        run: node scripts/build-cards-index.js

      # 상품명 키워드로 분류 안 되는 상품에 사이트 자체 카테고리(cate_no)를 입힌다.
      # 이 단계를 빼면 category=null 이 2,000건대로 늘어 룰북 #20(동일 카테고리 ≥2)이 무너진다.
      # 목록 ajax 기반이라 126요청·수십 초.
      - name: Enrich categories (cate_no)
        run: node scripts/enrich-categories.js

      - name: Commit & push if changed
        run: |
          git config user.name "billyjo-daily-sync[bot]"
          git config user.email "billyjo-daily-sync@users.noreply.github.com"
          git add cards/ cards-index.json
          if git diff --cached --quiet; then
            echo "no changes — nothing to commit"
          else
            COUNT=$(git diff --cached --name-only -- 'cards/*.html' | wc -l | tr -d ' ')
            IDX=$(node -e "console.log(require('./cards-index.json').count)")
            git commit -m "auto: daily card sync $(date -u +%Y-%m-%d) — ${COUNT} cards updated/added, index ${IDX}"
            # 실행 중에 누가 main 에 푸시하면 fast-forward 가 막혀 회차 작업이 통째로 버려진다
            # (2026-07-29 실측: 137장 생성분이 push 거절로 유실). rebase 후 재시도한다.
            for i in 1 2 3; do
              if git push; then
                echo "pushed (attempt $i)"
                exit 0
              fi
              echo "push rejected — rebase 후 재시도 ($i/3)"
              git pull --rebase --autostash origin main || exit 1
              sleep 5
            done
            echo "3회 재시도 실패"
            exit 1
          fi
