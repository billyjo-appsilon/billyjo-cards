name: Daily Card Sync

# 빌리조 카탈로그 변경 감지 → 신규 제품 카드 자동 생성·커밋
#
# 3시간마다 도는 이유(2026-07-29): 사이트가 짧은 시간에 몰린 prod_view 요청을 막는다.
# 실측 — 한 회차에 300건을 시도하면 138건만 성공하고 162건이 page.goto 타임아웃으로 밀렸다
# (약 140건이 한 창(window)의 한계). 한 번에 많이 긁는 대신 자주 조금씩 가져와
# 밀린 물량(3,000건대)을 며칠에 걸쳐 소화한다. 신규 등록분은 최대 3시간이면 카드가 생긴다.
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:  # 수동 트리거 허용

permissions:
  contents: write

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Run daily sync
        run: node scripts/daily-sync.js
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # cards/ 만 커밋하던 탓에 cards-index.json 이 2026-05-31 에 멈춰 있었다.
      # 이 인덱스는 추천 후보 풀이자 admin2 catalog_products 의 원본이라, 멈춘 동안
      # 신규 제품은 상세페이지 카드는 떠도 추천에는 한 건도 못 올라갔다(카드 보유 1,145건 누락).
      - name: Rebuild cards-index.json
        run: node scripts/build-cards-index.js

      - name: Commit & push if changed
        run: |
          git config user.name "billyjo-daily-sync[bot]"
          git config user.email "billyjo-daily-sync@users.noreply.github.com"
          git add cards/ cards-index.json
          if git diff --cached --quiet; then
            echo "no changes — nothing to commit"
          else
            COUNT=$(git diff --cached --name-only -- 'cards/*.html' | wc -l | tr -d ' ')
            IDX=$(node -e "console.log(require('./cards-index.json').count)")
            git commit -m "auto: daily card sync $(date -u +%Y-%m-%d) — ${COUNT} cards updated/added, index ${IDX}"
            git push
          fi
